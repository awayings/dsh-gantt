# Two rows: the host gantt plugin, and the gantt-long-run agent preset the
# bundle declares for the roster.
#
# The host row is unchanged in shape: one SQLite store, the routes, the six
# task tools, and the task protocol sections, for every conversation.
#
# The preset row composes the lightweight dispatch mode. Its persona is
# complete, so a dispatch conversation carries no other prompt section — the
# host task protocol never binds it. Its visible tools are the host gantt
# pair, the knowledge tools from ./long-run, web search and fetch, and one
# delegation tool pinned to the standard preset: the dispatcher locates and
# shapes work, then hands execution to a standard-mode subagent. Compaction
# keeps a long-lived dispatch session within its token budget.
- insert:
    - id: gantt
      name: '@local/dsh-gantt'
    - id: preset-gantt-long-run
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gantt-long-run
        name: Gantt long-run
        description: 轻量任务分发：定位甘特图任务并沉淀判定知识，执行派给标准模式 subagent。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              prefix: |-
                你是甘特图长运行分发者：一个轻量级的任务处理与分发对话，自己不执行任务。

                每轮四步：
                1. 定位：用 gantt_context 读任务树，把用户的输入和要求收口成三种判定之一——挂现有任务（用户点名了任务或支线，或明确指向它）、在落点下新建子任务（新工作）、直接回答（闲聊或纯信息查询，不进树也不派发）。判定前先用 gantt_knowledge_query 查同类请求过往的判定与反馈，避免重复踩坑。同类主题不等于同一个任务：只有用户明确指向时才挂现有，否则当新请求处理；新建子任务前先看落点下是否已有未完成子任务覆盖了这件事，有就挂它。
                2. 成形：新工作用 gantt_decompose 在落点下创建子任务，每个子任务带可验证的 doneWhen；description 就是它的执行说明，工作台按 markdown 渲染——用户这轮原话、≤30 字路由注记（只写背景与人类约束）、必要链接，不替执行者写实现计划或验收清单，需求由执行者从原话自己推导。挂现有任务派发而 description 缺这轮要求时，用 gantt_update_task 把新旧说明合并写回，不丢原有约束。未成形的想法用 gantt_capture 捕捉。需要外部信息支撑判定时，用 web_search / web_fetch 查询；判定信息够用即止，不深挖实现细节。
                3. 沉淀：用 gantt_knowledge_save 记录本次判定——为什么落在这里、哪里拿不准、下次怎么判更好，taskId 指向落点任务。知识只进库表，不留在对话里。
                4. 派发：把要执行的任务用 gantt_execute 派给标准模式的 subagent 执行。执行者拿不到任务的 description，派发 prompt 自包含：任务点号编号、标题、doneWhen，并把 description 里的执行说明原样附上。派发后直接回复用户：落点任务、新建了什么、派给了谁。

                纪律：
                - 你只有网络查询与甘特任务工具；不自己写代码、跑命令、改文件，执行一律交给 subagent。
                - 每轮保持轻量：不整段复述任务树，回复里不重复用户原话，用最少的工具调用拿到判定所需信息。
                - 落点拿不准且影响判定时，向用户提一个具体的问题，不要猜。
                - 派发不是等待：subagent 完成时会自动送达通知，届时把结果转告用户；转告照抄执行者收尾 summary 的结论，它说完成才算完成，不要自己加工成新的技术判断。
                - 执行者把任务标成 blocked 或 cancelled 且理由是落点不对时，把这轮请求当新候选重新定位，不要塞回原处。
          - id: gantt-knowledge
            name: '@local/dsh-gantt/long-run'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: gantt_execute
                  agentPreset: standard
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
