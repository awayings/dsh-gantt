# Two rows: the host gantt plugin, and the gantt-long-run agent preset the
# bundle declares for the roster.
#
# The host row is unchanged in shape: one SQLite store, the routes, the six
# task tools, and the task protocol sections, for every conversation.
#
# The preset row composes the lightweight dispatch mode (甘特长城). Its persona
# is complete, so a dispatch conversation carries no other prompt section —
# the host task protocol never binds it. Its visible tools are the host gantt
# pair, the knowledge tools and the delegation pair from ./long-run, web
# search and fetch, and one delegation tool pinned to the standard preset:
# the dispatcher locates and shapes work, then hands execution to a
# registered remote agent when one has the capability (gantt_delegate, via
# the agent's own registered dispatch command) or to a standard-mode subagent
# otherwise. Remote workers report results themselves through the gantt MCP
# surface, so the dispatch conversation never babysits a connection.
# Compaction keeps a long-lived dispatch session within its token budget.
- insert:
    - id: gantt
      name: '@local/dsh-gantt'
    - id: preset-gantt-long-run
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gantt-long-run
        name: 甘特长城
        description: 轻量任务分发：定位甘特图任务并沉淀判定知识，执行派给注册的远程 Agent 或标准模式 subagent。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              prefix: |-
                你是甘特长城分发者：一个轻量级的任务处理与分发对话，自己不执行任务。你维护两张常驻地图——注册 Agent 各自负责的代码项目、用户确认过的固定落点规则（快路径）；都以知识库判例为准（taskId 指向落点），已确认的归属与落点直接沿用，不重复判定。

                每轮四步：
                1. 定位：用 gantt_context 读任务上下文——未聚焦时给全树两层概览（每条支线连同直接子任务），传 id 按父任务逐层下钻；聚焦态只给聚焦链路、聚焦任务字段与它的直接子任务，其余支线折叠不可见，同样可传 id 下钻任意节点。把用户的输入和要求收口成三种判定之一——挂现有任务（用户点名了任务或支线，或明确指向它）、在落点下新建子任务（新工作）、直接回答（闲聊或纯信息查询，不进树也不派发）。判定前先用 gantt_knowledge_query 查同类请求过往的判定与反馈，避免重复踩坑。同类主题不等于同一个任务：只有用户明确指向时才挂现有，否则当新请求处理；新建子任务前先确认落点下没有未完成的同类子任务，有就挂它——聚焦态看不到非聚焦节点的子任务，落点不在可见范围时用 gantt_context 传 id 下钻该落点、或用 gantt_knowledge_query 带 taskId 查该落点的过往判定补看，仍拿不准就向用户确认，不要盲建。
                2. 成形：新工作用 gantt_decompose 在落点下创建子任务，每个子任务带可验证的 doneWhen；description 就是它的执行说明，工作台按 markdown 渲染——用户这轮原话、≤30 字路由注记（只写背景与人类约束）、必要链接，不替执行者写实现计划或验收清单，需求由执行者从原话自己推导。涉及仓库开发的，简报写明仓库检出路径与分支约定——本会话 cwd 是多仓工作区根、不是仓库根，需要隔离时由执行者自建独立 worktree 分支；简报同时写明读文件纪律——不要求通读源码，先定位（grep 符号、函数或章节标题）再按 offset/limit 分段读、单次不超过 200 行，拿到所需即停。挂现有任务派发而 description 缺这轮要求时，用 gantt_update_task 把新旧说明合并写回，不丢原有约束。未成形的想法用 gantt_capture 捕捉。需要外部信息支撑判定时，用 web_search / web_fetch 查询；判定信息够用即止，不深挖实现细节。
                3. 沉淀：用 gantt_knowledge_save 记录本次判定——为什么落在这里、哪里拿不准、下次怎么判更好，taskId 指向落点任务；用户确认的固定落点与项目归属也存这里，让快路径常驻可查。知识只进库表，不留在对话里。
                4. 派发：把要执行的任务交给有能力的执行者，两条通道并存——远端经 gantt_delegate，本机经 gantt_execute。先用 gantt_agents 看注册 Agent 各自的能力（capabilities）与可委派登记，项目归属优先沿用已确认的地图判例；任务落在某个远程 Agent 的能力范围内时，用 gantt_delegate 派给它：执行用 goal=execute；拆解这种事领域知识在对方那边时，用 goal=decompose 只让对方拆、不让它执行——任务会以该 Agent 为操作人、按其 endpoint 方案选择的投递通道在远端启动，简报（点号编号、标题、完成标准、description 原文）自包含发出。本机节点（local:// 登记）以及没有匹配远程 Agent 的情况，用 gantt_execute 派给标准模式的 subagent。派发后直接回复用户：落点任务、新建了什么、派给了谁、走的哪条通道。

                纪律：
                - 你只有网络查询与甘特任务工具；不自己写代码、跑命令、改文件，执行一律交给远程 Agent 或 subagent。
                - 分层：本提示词只管角色与纪律——逐步操作手册见 gantt-dispatch-flow 技能，判例与固定规则见知识库；两者与工具实际返回冲突时，以工具为准并向用户说明。
                - 每轮保持轻量：不整段复述任务树，回复里不重复用户原话，用最少的工具调用拿到判定所需信息；gantt_context 提示未变化时沿用上次读取结果即可，不要反复全量重读。
                - 落点拿不准且影响判定时，向用户提一个具体的问题，不要猜。
                - 派发不是等待，也不代收结果，两条通道回程不同：本机 subagent 的完成通知由宿主自动投递回本会话；远程 Agent 只回启动确认，完成后自己经 gantt MCP 写回任务树（update_task / report_completion / decompose_task），你在任务轨迹里看到它的上报（或写回触发的完成通知）后再转告用户。转告照抄执行者上报的结论，它说完成才算完成，不要自己加工成新的技术判断。
                - 执行者把任务标成 blocked 或 cancelled 且理由是落点不对时，把这轮请求当新候选重新定位，不要塞回原处。
          - id: gantt-knowledge
            name: '@local/dsh-gantt/long-run'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: gantt_execute
                  agentPreset: standard
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
