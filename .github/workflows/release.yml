name: Release

# Fires on a release tag (v*) push. The package is private and ships its source directly, so there is no npm
# publish: the release is the GitHub Release itself.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `packageManager` field in this plugin's package.json, so the version is pinned here explicitly.
      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # `pnpm run coverage` runs the same vitest suite, plus the per-file coverage thresholds; `pnpm run test` skips them.
      - name: Test and coverage thresholds
        run: pnpm run coverage

      # The end-to-end suite: the shipped client artifact over real HTTP against the real route handlers and a real
      # SQLite file. It runs locally as part of `pnpm run check`, so it runs here for parity.
      - name: End-to-end suite
        run: pnpm run e2e

      - name: Verify version matches the tag
        run: |
          TAG="${{ github.ref_name }}"
          VER="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package version $VER"
            exit 1
          fi

      # One tarball carries both deployment units (the plugin bundle and the
      # gantt-mcp sidecar); `scripts/package.mjs` also validates its contents and
      # writes the SHA256SUMS published next to it.
      - name: Package the release tarball
        run: pnpm run package

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes .tmp/dist/*.tgz .tmp/dist/SHA256SUMS
